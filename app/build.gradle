plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.armazempro.app'
    compileSdk 36

    defaultConfig {
        applicationId "br.com.armazempro.app"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.1.0"
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.14.0'
}
